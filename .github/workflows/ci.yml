name: Windows CI & Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    name: Build, Lint & Test (windows-latest)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: clippy

      - name: Install frontend dependencies
        run: npm ci

      - name: Type-check TypeScript
        run: npx tsc --noEmit

      - name: Build frontend
        run: npm run build

      - name: Run Rust unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Run Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

  release:
    name: Build Release Installer (windows-latest)
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri release bundle
        run: npx tauri build

      - name: Stage release files
        shell: pwsh
        run: |
          $ver = (Get-Content package.json -Raw | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force -Path release-staging | Out-Null
          Copy-Item "src-tauri/target/release/rtv-highperf.exe" "release-staging/rtv-highperf_${ver}_x64-portable.exe"
          Copy-Item "src-tauri/target/release/bundle/nsis/*.exe" "release-staging/"
          Copy-Item "src-tauri/target/release/bundle/msi/*.msi" "release-staging/"
          Get-ChildItem release-staging

      - name: Upload unsigned bundle artifacts
        id: upload-unsigned
        uses: actions/upload-artifact@v4
        with:
          name: rtv-highperf-windows-x86_64
          path: release-staging/
          if-no-files-found: error

      - name: Check SignPath configuration
        id: check-signpath
        shell: pwsh
        env:
          SP_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
          SP_ORG: ${{ vars.SIGNPATH_ORGANIZATION_ID || secrets.SIGNPATH_ORGANIZATION_ID }}
          SP_PROJ: ${{ vars.SIGNPATH_PROJECT_SLUG || secrets.SIGNPATH_PROJECT_SLUG }}
        run: |
          $ready = (-not [string]::IsNullOrWhiteSpace($env:SP_TOKEN)) -and (-not [string]::IsNullOrWhiteSpace($env:SP_ORG)) -and (-not [string]::IsNullOrWhiteSpace($env:SP_PROJ))
          if ($ready) {
            "enabled=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          } else {
            Write-Host "::notice::SignPath secrets/variables not configured yet; publishing unsigned artifacts."
            "enabled=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }

      - name: Submit signing request to SignPath.io
        if: steps.check-signpath.outputs.enabled == 'true'
        uses: signpath/github-action-submit-signing-request@v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID || secrets.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || secrets.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY || 'release-signing' }}
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: release-signed

      - name: Prepare final release assets
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-final | Out-Null
          if (Test-Path "release-signed") {
            Get-ChildItem -Path "release-signed" -File -Recurse | ForEach-Object {
              Copy-Item $_.FullName "release-final/$($_.Name)" -Force
            }
          }
          if (-not (Get-ChildItem -Path "release-final" -File)) {
            Copy-Item "release-staging/*" "release-final/" -Force
          }
          Get-ChildItem release-final

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-final/*
          fail_on_unmatched_files: true
          generate_release_notes: true
