name: Windows CI & Release

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main

jobs:
  build-and-test:
    name: Build, Lint & Test (windows-latest)
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
          components: clippy

      - name: Install frontend dependencies
        run: npm ci

      - name: Type-check TypeScript
        run: npx tsc --noEmit

      - name: Build frontend
        run: npm run build

      - name: Run Rust unit tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Run Clippy
        run: cargo clippy --manifest-path src-tauri/Cargo.toml -- -D warnings

  release:
    name: Build Release Installer (windows-latest)
    needs: build-and-test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri release bundle
        run: npx tauri build

      - name: Stage release files
        shell: pwsh
        run: |
          $ver = (Get-Content package.json -Raw | ConvertFrom-Json).version
          New-Item -ItemType Directory -Force -Path release-final | Out-Null
          Copy-Item "src-tauri/target/release/rtv-highperf.exe" "release-final/rtv-highperf_${ver}_x64-portable.exe"
          Copy-Item "src-tauri/target/release/bundle/nsis/*.exe" "release-final/"
          Copy-Item "src-tauri/target/release/bundle/msi/*.msi" "release-final/"
          Get-FileHash "release-final/*" -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower())  $([System.IO.Path]::GetFileName($_.Path))" } |
            Out-File -FilePath "release-final/SHA256SUMS.txt" -Encoding utf8
          Get-ChildItem release-final

      - name: Upload bundle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rtv-highperf-windows-x86_64
          path: release-final/
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-final/*
          fail_on_unmatched_files: true
          generate_release_notes: true
